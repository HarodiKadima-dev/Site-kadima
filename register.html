<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registar - Kadima</title>
<link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="top-bar">
    <button class="back-btn" id="backBtn">←</button>
    <div class="tabs">
      <button id="tabLogin">Iniciar Sessão</button>
      <button id="tabRegister" class="active">Criar Conta</button>
    </div>
  </div>

  <div class="container">
    <h2>Preencha os dados para te registar</h2>

    <input type="text" id="nome" placeholder="Digite seu nome">
    <input type="password" id="senha" placeholder="Palavra Passe">
    <input type="password" id="confirmarSenha" placeholder="Confirmar palavra passe">

    <p id="mensagem" class="msg"></p>

    <button id="btnRegistar">Registar</button>
  </div>

<script src="register.js"></script>
</body>
</html>
